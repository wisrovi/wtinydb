[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wtinydb"
version = "1.1.0"
description = "Pydantic-powered document database abstraction layer on top of TinyDB"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "WILLIAM R.", email = "william@ecapturedtech.com"}
]
keywords = ["tinydb", "pydantic", "nosql", "document-database", "orm", "database"]
dependencies = [
    "tinydb>=4.8.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
wtinydb = "wtinydb.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
